# fly.toml app configuration file generated for ara-os on 2025-11-25T19:57:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ara-os'
primary_region = 'lhr'

[build]

[deploy]
  release_command = 'bunx prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '10s'
  timeout = '2s'
  grace_period = '5s'
  method = 'GET'
  path = '/api/healthcheck'

[[vm]]
  memory = '768mb'
  cpu_kind = 'shared'
  cpus = 1
